name: リリース

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: ソースコードのチェックアウト
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: .NET SDK のセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: YMM4 最新リリースの取得と解凍
        id: ymm4
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/manju-summoner/YukkuriMovieMaker4/releases/latest" `
            -Headers @{ "User-Agent" = "UTAU-CI" }
          $asset = $release.assets | Where-Object { $_.name -like "*_Lite.zip" } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          }
          Write-Host "ダウンロード対象: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "ymm4.zip"
          Expand-Archive -Path "ymm4.zip" -DestinationPath "ymm4_extracted" -Force
          $ymm4Dir = (Get-ChildItem -Path "ymm4_extracted" -Recurse -Filter "YukkuriMovieMaker.dll" |
            Select-Object -First 1).DirectoryName
          Write-Host "YMM4 DLL ディレクトリ: $ymm4Dir"
          echo "YMM4_DIR=$ymm4Dir\" >> $env:GITHUB_OUTPUT

      - name: タグ名からバージョンを取得
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "VERSION=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: バージョン記載の照合と訂正
        shell: pwsh
        run: |
          function Read-TextKeepingBom {
            param([string]$Path)
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $offset = 0
            if ($hasBom) { $offset = 3 }
            return @{
              Text = [System.Text.Encoding]::UTF8.GetString($bytes, $offset, $bytes.Length - $offset)
              HasBom = $hasBom
            }
          }

          function Write-TextKeepingBom {
            param([string]$Path, [string]$Text, [bool]$HasBom)
            $body = [System.Text.Encoding]::UTF8.GetBytes($Text)
            if ($HasBom) { $body = [byte[]](0xEF, 0xBB, 0xBF) + $body }
            [System.IO.File]::WriteAllBytes($Path, $body)
          }

          function Repair-VersionFiles {
            param([string]$Root, [string]$Version, [string]$Tag)
            $changed = @()

            $csprojPath = Join-Path $Root "UTAU/UTAU.csproj"
            $csproj = Read-TextKeepingBom -Path $csprojPath
            $wantedCsproj = "<Version>$Version</Version>"
            if (-not $csproj.Text.Contains($wantedCsproj)) {
              $updated = $csproj.Text -replace '<Version>[^<]*</Version>', $wantedCsproj
              if (-not $updated.Contains($wantedCsproj)) { throw "UTAU.csproj に <Version> が見つかりませんでした" }
              Write-TextKeepingBom -Path $csprojPath -Text $updated -HasBom $csproj.HasBom
              $changed += "UTAU/UTAU.csproj"
            }

            $readmePath = Join-Path $Root ".github/Plugin_Readme.txt"
            $readme = Read-TextKeepingBom -Path $readmePath
            $wantedHeading = " UTAU for YMM4 $Tag"
            if (-not $readme.Text.Contains($wantedHeading)) {
              $updated = $readme.Text -replace '(?m)^( UTAU for YMM4 )v[0-9][^\r\n]*', "`${1}$Tag"
              if (-not $updated.Contains($wantedHeading)) { throw "Plugin_Readme.txt の見出しが見つかりませんでした" }
              Write-TextKeepingBom -Path $readmePath -Text $updated -HasBom $readme.HasBom
              $changed += ".github/Plugin_Readme.txt"
            }

            return $changed
          }

          $tag = "${{ steps.version.outputs.TAG }}"
          $version = "${{ steps.version.outputs.VERSION }}"
          $changed = Repair-VersionFiles -Root "." -Version $version -Tag $tag

          if ($changed.Count -eq 0) {
            Write-Host "バージョン記載は $tag と一致しています"
            exit 0
          }

          Write-Host "タグと合わない記載を訂正しました: $($changed -join ', ')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --quiet

          $sync = Join-Path $env:RUNNER_TEMP "version-sync"
          git worktree add $sync origin/main --quiet
          Repair-VersionFiles -Root $sync -Version $version -Tag $tag | Out-Null

          Push-Location $sync
          git add -A
          $pending = git diff --cached --name-only
          if ($pending) {
            git commit -m "バージョンを${tag}へ合わせる" --quiet
            git push origin HEAD:main
            Write-Host "main へ訂正を反映しました"
          } else {
            Write-Host "main は既に $tag と一致しています"
          }
          Pop-Location

          git worktree remove $sync --force

      - name: resx ファイルの生成（初回ビルド）
        shell: pwsh
        run: |
          $proj = "UTAU/UTAU.csproj"
          dotnet build "$proj" `
            -c Release `
            -p:YMM4DirPath="${{ steps.ymm4.outputs.YMM4_DIR }}" `
            -p:SkipPluginDeploy=true

      - name: プロジェクトのビルド
        shell: pwsh
        run: |
          $proj = "UTAU/UTAU.csproj"
          dotnet build "$proj" `
            -c Release `
            -p:YMM4DirPath="${{ steps.ymm4.outputs.YMM4_DIR }}" `
            -p:SkipPluginDeploy=true

      - name: パッケージの作成
        id: package
        shell: pwsh
        run: |
          $version   = "${{ steps.version.outputs.TAG }}"
          $outDir    = "UTAU/bin/Release/net10.0-windows10.0.19041.0"
          $stageRoot = "stage/UTAU"
          $pkgName   = "UTAU_$version.ymme"

          New-Item -ItemType Directory -Path $stageRoot -Force | Out-Null
          New-Item -ItemType Directory -Path "$stageRoot/LICENSE" -Force | Out-Null

          foreach ($name in @("UTAU.dll", "WorldNet.dll")) {
            $path = "$outDir/$name"
            if (-not (Test-Path $path)) {
              Write-Error "ビルド結果に $name が見つかりませんでした: $path"
              exit 1
            }
            Copy-Item $path "$stageRoot/"
          }

          foreach ($lang in @("ar-sa", "en-us", "es-es", "id-id", "ko-kr", "zh-cn", "zh-tw")) {
            $src = "$outDir/$lang"
            if (Test-Path $src) {
              New-Item -ItemType Directory -Path "$stageRoot/$lang" -Force | Out-Null
              Copy-Item "$src/*.dll" "$stageRoot/$lang/"
            }
          }

          Copy-Item ".github/LICENSE/*.txt"     "$stageRoot/LICENSE/"
          Copy-Item ".github/Plugin_Readme.txt" "$stageRoot/Readme.txt"

          $readme = Get-Content "$stageRoot/Readme.txt" -Raw
          if (-not $readme.Contains(" UTAU for YMM4 $version")) {
            Write-Error "同梱する Readme.txt の見出しが $version と一致しません"
            exit 1
          }

          Compress-Archive -Path "stage/*" -DestinationPath $pkgName -CompressionLevel Optimal
          echo "PKG_NAME=$pkgName" >> $env:GITHUB_OUTPUT

      - name: 変更履歴の作成
        id: changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          PACKAGE: ${{ steps.package.outputs.PKG_NAME }}
        run: |
          $tag        = $env:TAG
          $repository = $env:REPOSITORY
          $server     = $env:SERVER_URL
          $code       = [char]0x60
          $fence      = [string]::new($code, 3)
          $unit       = [char]0x1f

          $previous = ""
          $candidates = @(git tag --list "v*" --merged $tag --sort=-creatordate | Where-Object { $_ -ne $tag })
          if ($candidates.Count -gt 0) {
            $previous = $candidates[0]
          }
          Write-Host "直前のタグ: $previous"

          $range = if ($previous) { "$previous..$tag" } else { $tag }
          $log = @(git log "--format=%H%x1f%s%x1f%an%x1f%ad" --date=short $range)

          $commits = @()
          foreach ($line in $log) {
            if (-not $line) { continue }
            $fields = $line -split $unit
            if ($fields.Count -lt 4) { continue }
            $commits += [pscustomobject]@{
              Sha     = $fields[0]
              Subject = $fields[1]
              Name    = $fields[2]
              Date    = $fields[3]
              Login   = ""
              Avatar  = ""
            }
          }
          Write-Host "コミット数: $($commits.Count)"

          $pending = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($commit in $commits) {
            [void]$pending.Add($commit.Sha)
          }

          $accounts = @{}
          $page = 1
          while ($pending.Count -gt 0 -and $page -le 20) {
            $rows = @()
            try {
              $rows = @(gh api "repos/$repository/commits?sha=$tag&per_page=100&page=$page" --jq '.[] | [.sha, (.author.login // ""), (.author.avatar_url // "")] | @tsv')
            }
            catch {
              Write-Host "コミットの作者を取得できませんでした: $($_.Exception.Message)"
              break
            }
            if ($LASTEXITCODE -ne 0 -or $rows.Count -eq 0) { break }

            foreach ($row in $rows) {
              $fields = $row -split "`t"
              if ($fields.Count -lt 3) { continue }
              if ($pending.Remove($fields[0])) {
                $accounts[$fields[0]] = @{ Login = $fields[1]; Avatar = $fields[2] }
              }
            }

            if ($rows.Count -lt 100) { break }
            $page++
          }

          foreach ($commit in $commits) {
            if ($accounts.ContainsKey($commit.Sha)) {
              $commit.Login  = $accounts[$commit.Sha].Login
              $commit.Avatar = $accounts[$commit.Sha].Avatar
            }
          }

          $emptyTree = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          $base = if ($previous) { $previous } else { $emptyTree }
          $shortstat = (@(git diff --shortstat $base $tag) -join " ")
          $changedFiles = 0
          $insertions   = 0
          $deletions    = 0
          if ($shortstat -match "(\d+) file")      { $changedFiles = [int]$Matches[1] }
          if ($shortstat -match "(\d+) insertion") { $insertions   = [int]$Matches[1] }
          if ($shortstat -match "(\d+) deletion")  { $deletions    = [int]$Matches[1] }
          $diffStat = @(git diff --stat $base $tag)
          $tagDate = (git log -1 "--format=%ad" --date=short $tag)

          $contributors = @($commits |
            Group-Object -Property { if ($_.Login) { $_.Login } else { $_.Name } } |
            Sort-Object -Property Count -Descending)

          function Get-Icon($avatar, $login, $size) {
            if (-not $avatar) { return "" }
            $sized = if ($avatar.Contains("?")) { "$avatar&s=$($size * 2)" } else { "$avatar" + "?s=$($size * 2)" }
            return "<img src=""$sized"" width=""$size"" height=""$size"" alt=""$login""> "
          }

          $package = Get-Item $env:PACKAGE
          $size = [math]::Round($package.Length / 1MB, 2)

          $body = [System.Collections.Generic.List[string]]::new()
          $body.Add("## 概要")
          $body.Add("")
          $body.Add("| 項目 | 内容 |")
          $body.Add("|---|---|")
          $body.Add("| タグ | [$tag]($server/$repository/tree/$tag) |")
          $body.Add("| 公開日 | $tagDate |")
          if ($previous) {
            $body.Add("| 直前のリリース | [$previous]($server/$repository/releases/tag/$previous) |")
          }
          $body.Add("| コミット数 | $($commits.Count) |")
          $body.Add("| 貢献者 | $($contributors.Count) 名 |")
          $body.Add("| 変更されたファイル | $changedFiles |")
          $body.Add("| 追加された行 | $insertions |")
          $body.Add("| 削除された行 | $deletions |")

          $body.Add("")
          $body.Add("## ダウンロード")
          $body.Add("")
          $body.Add("| ファイル | サイズ |")
          $body.Add("|---|---|")
          $body.Add("| $($package.Name) | $size MB |")

          $body.Add("")
          $body.Add("## 貢献者")
          $body.Add("")
          $body.Add("| 貢献者 | コミット数 |")
          $body.Add("|---|---|")
          foreach ($contributor in $contributors) {
            $first = $contributor.Group[0]
            if ($first.Login) {
              $name = (Get-Icon $first.Avatar $first.Login 40) + "[@$($first.Login)]($server/$($first.Login))"
            }
            else {
              $name = $first.Name
            }
            $body.Add("| $name | $($contributor.Count) |")
          }

          $body.Add("")
          $body.Add("## 変更履歴")
          $body.Add("")
          $body.Add("| コミット | 内容 | 貢献者 | 日付 |")
          $body.Add("|---|---|---|---|")
          $maximumCommits = 300
          $listed = 0
          foreach ($commit in $commits) {
            if ($listed -ge $maximumCommits) { break }
            $short = $commit.Sha.Substring(0, 7)
            $subject = $commit.Subject -replace '\|', '\|'
            if ($commit.Login) {
              $author = (Get-Icon $commit.Avatar $commit.Login 20) + "[@$($commit.Login)]($server/$($commit.Login))"
            }
            else {
              $author = $commit.Name
            }
            $body.Add("| [$code$short$code]($server/$repository/commit/$($commit.Sha)) | $subject | $author | $($commit.Date) |")
            $listed++
          }
          if ($commits.Count -gt $maximumCommits) {
            $body.Add("")
            $body.Add("残り $($commits.Count - $maximumCommits) 件のコミットは省略しました。")
          }

          if ($diffStat.Count -gt 0) {
            $body.Add("")
            $body.Add("## 変更されたファイル")
            $body.Add("")
            $body.Add("<details>")
            $body.Add("<summary>差分の統計</summary>")
            $body.Add("")
            $body.Add($fence)
            $maximumStatLines = 200
            $shown = 0
            foreach ($line in $diffStat) {
              if ($shown -ge $maximumStatLines) { break }
              $body.Add($line)
              $shown++
            }
            if ($diffStat.Count -gt $maximumStatLines) {
              $body.Add("... 残り $($diffStat.Count - $maximumStatLines) 行は省略しました。")
            }
            $body.Add($fence)
            $body.Add("")
            $body.Add("</details>")
          }

          if ($previous) {
            $body.Add("")
            $body.Add("## 全ての変更")
            $body.Add("")
            $body.Add("$server/$repository/compare/$previous...$tag")
          }

          $path = "release-body.md"
          Set-Content -Path $path -Value ($body -join "`n") -Encoding utf8NoBOM
          if (-not (Test-Path $path)) {
            throw "変更履歴を作成できませんでした。"
          }
          Write-Host "変更履歴の行数: $($body.Count)"
          $global:LASTEXITCODE = 0

      - name: GitHub リリースの作成
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.TAG }}
          body_path: release-body.md
          files: ${{ steps.package.outputs.PKG_NAME }}
          draft: false
          prerelease: false
